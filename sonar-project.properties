# SonarQube Cloud settings - check both keys on sonarcloud.io after importing the repo
# (Project > Information shows the exact values)
sonar.organization=rupessh-metra
sonar.projectKey=Rupessh-Metra_color-cicd-demo
sonar.projectName=color-cicd-demo

# What to analyse
sonar.sources=app.py
sonar.tests=tests
sonar.python.version=3.12

# Test coverage report created by pytest-cov in the pipeline
sonar.python.coverage.reportPaths=coverage.xml

# Make the pipeline wait for the Quality Gate and fail if it fails
sonar.qualitygate.wait=true
