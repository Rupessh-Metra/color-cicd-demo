# SonarQube Cloud settings
sonar.organization=rupessh-metra
sonar.projectKey=Rupessh-Metra_color-cicd-demo
sonar.projectName=color-cicd-demo

# What to analyse
sonar.sources=app.py
sonar.python.version=3.12

# No unit tests in this demo, so don't measure test coverage
sonar.coverage.exclusions=**/*

# Make the pipeline wait for the Quality Gate and fail if it fails
sonar.qualitygate.wait=true
